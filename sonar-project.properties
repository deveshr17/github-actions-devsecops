# SonarCloud project configuration.
# Organization and project key are placeholders; set them to your SonarCloud
# organization and the project you created for this repository.
sonar.organization=deveshr17
sonar.projectKey=deveshr17_github-actions-devsecops
sonar.projectName=github-actions-devsecops
sonar.host.url=https://sonarcloud.io

# Sources and tests
sonar.sources=app/src
sonar.tests=app/src
sonar.test.inclusions=app/src/**/*.test.js
sonar.exclusions=app/node_modules/**,app/coverage/**,k8s/**,docs/**

# Coverage produced by `npm run test:ci` (node:test lcov reporter).
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.coverage.exclusions=app/src/**/*.test.js,app/scripts/**

sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=2048

# Quality gate is enforced by SonarSource/sonarqube-quality-gate-action in ci.yml.
sonar.qualitygate.wait=false
