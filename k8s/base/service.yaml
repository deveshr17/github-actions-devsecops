apiVersion: v1
kind: Service
metadata:
  name: sample-service
  labels:
    app.kubernetes.io/component: api
  annotations:
    # GKE: container-native load balancing (NEG) for Ingress/Gateway backends.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
