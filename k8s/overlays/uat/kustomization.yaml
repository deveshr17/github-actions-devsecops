apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-service-uat

resources:
  - ../../base
  - namespace.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: sample-service-uat
      app.kubernetes.io/environment: uat

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: sample-service
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: sample-service

configMapGenerator:
  - name: sample-service-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - ENVIRONMENT=uat

# Image tag is set in CI: kustomize edit set image sample-service=<image>@<digest>
images:
  - name: sample-service
    newName: asia-south1-docker.pkg.dev/example-project-dev/apps/sample-service
    newTag: sha-0000000
