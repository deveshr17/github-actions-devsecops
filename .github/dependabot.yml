version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      prefix-development: "chore"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
